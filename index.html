<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> HBD Dania 🎉 </title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            margin: 0; 
            overflow-x: hidden; 
            font-family: 'Tajawal', sans-serif; 
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            color: #880e4f; 
            min-height: 100vh;
        }
        
        /* تأثيرات النجوم والقلوب العائمة */
        .floating-element { 
            position: absolute; 
            animation: floatUp linear infinite; 
            opacity: 0.6; 
            z-index: 1;
            pointer-events: none;
        }
        
        @keyframes floatUp { 
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; } 
            20% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5) rotate(360deg); opacity: 0; } 
        }

        .container { 
            text-align: center; 
            max-width: 650px; 
            margin: 8vh auto; 
            background: rgba(255, 255, 255, 0.7); 
            padding: 45px 30px; 
            border-radius: 25px; 
            box-shadow: 0 15px 35px rgba(216, 27, 96, 0.15); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            position: relative; 
            z-index: 10;
            min-height: 400px;
        }

        .step { 
            display: none; 
        }
        
        .step.active { 
            display: block; 
        }
        
        /* تنسيق الصور */
        .intro-image {
            width: 100%;
            max-width: 350px; 
            margin: 15px auto 25px auto;
            display: block;
            box-shadow: 0 10px 25px rgba(216, 27, 96, 0.2);
            border: 5px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px; 
        }

        h1 { 
            font-size: 2.2em; 
            margin-bottom: 20px; 
            color: #c2185b; 
        }
        
        .typewriter-text { 
            font-size: 1.25em; 
            line-height: 1.9; 
            color: #4a4a4a; 
            margin-bottom: 15px;
            min-height: 1.2em;
            display: inline-block;
        }

        /* مربع الحديث الشريف */
        .hadith-box {
            background: rgba(255, 255, 255, 0.9);
            border-right: 5px solid #d81b60;
            padding: 20px;
            margin: 25px 0;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1.15em;
            text-align: center;
            opacity: 0; /* يبدأ مخفي ليظهر بعد انتهاء الكتابة */
            transition: opacity 1s ease;
        }
        
        #countdown-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin: 25px 0;
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.1);
        }
        
        #countdown {
            font-size: 1.5em;
            font-weight: 700;
            color: #d81b60;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center; 
            gap: 15px; 
            margin-top: 35px;
            flex-wrap: wrap;
        }
        
        .btn { 
            background: linear-gradient(45deg, #d81b60, #ec407a); 
            color: white; 
            border: none; 
            padding: 12px 35px; 
            font-size: 1.15em; 
            border-radius: 30px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            font-weight: 700;
        }
        
        .btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.4);
        }
        
        .btn-back {
            background: rgba(244, 143, 177, 0.5);
            color: #880e4f;
        }

        .final-question {
            font-size: 2.2em;
            color: #ad1457;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>

    <div id="floating-container"></div>

    <audio id="bg-music" loop>
        <source src="YOUR_SONG.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        
        <div id="step1" class="step active">
            <img src="HBD.png" alt="HBD" class="intro-image">
            <h1 class="typing-target">كل عام وأنتِ بألف خير دندن 💖</h1>
            
            <div id="countdown-container">
                <div id="countdown-title">باقي لتصيري 20 سنة:</div>
                <div id="countdown">جاري الحساب...</div>
            </div>

            <div class="buttons-container">
                <button class="btn" onclick="nextStep(1)">اضغطي هون ✨</button>
            </div>
        </div>

        <div id="step2" class="step">
            <h1>دانية العزيزة 🌸</h1>
            <p class="typewriter-text" data-text="قعدت فترة بفكر ايش اجيب هدية الك، بكل افكاري ما كان بنفع اقدم الي بخطرلي. ما لقيت الا هالطريقة البسيطة جداً."></p>

            <div class="buttons-container">
                <button class="btn btn-back" onclick="prevStep(2)">🔙 رجوع</button>
                <button class="btn" onclick="nextStep(2)">التالي ✨</button>
            </div>
        </div>

        <div id="step3" class="step">
            <p class="typewriter-text" data-text="دايما كنتي الشخص الي بكون معي بكل مكان وبكل ظرف من السيء للاشياء الي ما رح انساها. من وقت كنت مكتئب ومش قادر اعيش لوقت التخرج. احداث كثير ما حدا بعرفها غيري وغيرك، خناقات ومصالحات ما حدا بعرفها. ما بتعرفي كم انتي حدا كثير مهم بحياتي وكم بحبك، كشخص مثلي ما عمري كنت انتبه للتفاصيل معك صرت احاول ادقق (لسا مبتدئ ولكن بحاول :)"></p>
            <br>
            <h2 style="color: #c2185b;">حتسأليني ليش؟ ليش انا؟</h2>
            <p class="typewriter-text" data-text="ببساطة؟ لانك دانية، لانك دانية حبيتك ما عندي سبب اقوى من هيك."></p>

            <div class="buttons-container">
                <button class="btn btn-back" onclick="prevStep(3)">🔙 رجوع</button>
                <button class="btn" onclick="nextStep(3)">كملي قراءة ❤️</button>
            </div>
        </div>

        <div id="step4" class="step">
            <p class="typewriter-text" data-text="دايما بحكيلك ودايما بأكدلك انا معك عالمر والحلو، ايدي دايما ممدوده الك. لاني بنبسط وانا معك بنفس الطريق، بنبسط وانا بساعدك، بنبسط بس اسمع صوتك، بنبسط بس تتنمري علي 😂 صح بحبش كثير لما تحرجيني، بس فعالياتك هاي بتحسسني بشعور هيك اني مرتاح بتمنى يكون عندك نفس الشعور."></p>
            
            <img src="dumb-smart.png" alt="dumb-smart" class="intro-image">
            
            <p class="typewriter-text" data-text="صح انه انا احيانا بكون غبي وتصرفاتي غبية بس معلش هو هيك مخي قد ما احاول ما بتغير. وجد بتمنى دايما تضلي بخير ودايما بدعيلك بصلاتي، هي هيك الحياه."></p>
            
            <div class="hadith-box" id="hadith">
                "ما أصابك لم يكن ليخطئك وما أخطأك لم يكن ليصيبك.. دايماً تذكريه."
            </div>

            <div class="buttons-container">
                <button class="btn btn-back" onclick="prevStep(4)">🔙 رجوع</button>
                <button class="btn" onclick="nextStep(4)">الصفحة الأخيرة 💌</button>
            </div>
        </div>

        <div id="step5" class="step">
            <h1 class="final-question typewriter-text" data-text="وبالنهايه هذا سؤال... ممكن نضل دايما مع بعض؟ 🥺❤️"></h1>
            
            <div class="buttons-container" id="final-buttons">
                <button class="btn btn-yes" onclick="celebrate()">أكيد 💍</button>
                <button class="btn btn-yes" onclick="celebrate()">طبعاً 🌸</button>
            </div>
        </div>

    </div>

    <script>
        // دالة الكتابة التدريجية
        function typeAllInStep(stepId) {
            const step = document.getElementById('step' + stepId);
            const targets = step.querySelectorAll('.typewriter-text');
            
            targets.forEach((target, index) => {
                const text = target.getAttribute('data-text');
                target.innerText = '';
                
                // تأخير بسيط بين الفقرات
                setTimeout(() => {
                    let i = 0;
                    const interval = setInterval(() => {
                        target.innerText += text.charAt(i);
                        i++;
                        if (i >= text.length) {
                            clearInterval(interval);
                            // إظهار مربع الحديث إذا كان موجوداً في الصفحة
                            if(document.getElementById('hadith')) {
                                document.getElementById('hadith').style.opacity = '1';
                            }
                        }
                    }, 40); // سرعة الكتابة (40 ملي ثانية لكل حرف)
                }, index * 1000); 
            });
        }

        function nextStep(current) {
            document.getElementById('step' + current).classList.remove('active');
            const next = current + 1;
            document.getElementById('step' + next).classList.add('active');
            
            typeAllInStep(next);

            if (current === 2) {
                let audio = document.getElementById('bg-music');
                audio.play().catch(e => console.log("Audio play blocked"));
            }
        }

        function prevStep(current) {
            document.getElementById('step' + current).classList.remove('active');
            const prev = current - 1;
            document.getElementById('step' + prev).classList.add('active');
            typeAllInStep(prev);
            
            if (current === 3) {
                let audio = document.getElementById('bg-music');
                audio.pause();
                audio.currentTime = 0; 
            }
        }

        // العداد التنازلي
        function startCountdown() {
            const countDownDate = new Date("July 17, 2026 00:00:00").getTime();
            setInterval(function() {
                const now = new Date().getTime();
                const distance = countDownDate - now;
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                if (distance < 0) {
                    document.getElementById("countdown").innerHTML = "صار عمرك 20 سنة! 🎉";
                } else {
                    document.getElementById("countdown").innerHTML = 
                        days + " يوم و " + hours + " ساعة و " + minutes + " دقيقة و " + seconds + " ثانية";
                }
            }, 1000);
        }
        startCountdown();

        // الفقاعات العائمة
        function createFloatingElements() {
            const container = document.getElementById('floating-container');
            const elements = ['✨', '🌸', '🤍', '💖', '⭐']; 
            setInterval(() => {
                const el = document.createElement('div');
                el.innerHTML = elements[Math.floor(Math.random() * elements.length)];
                el.classList.add('floating-element');
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = Math.random() * 4 + 5 + 's'; 
                el.style.fontSize = Math.random() * 15 + 15 + 'px'; 
                container.appendChild(el);
                setTimeout(() => el.remove(), 9000);
            }, 600); 
        }
        createFloatingElements();

        function celebrate() {
            const container = document.getElementById('floating-container');
            document.getElementById('final-buttons').innerHTML = "<h2 style='color:#c2185b;'>وأنا بوعدك أضل معك دايماً ❤️</h2>";
            for(let i=0; i<60; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.innerHTML = '❤️';
                    el.classList.add('floating-element');
                    el.style.left = Math.random() * 100 + 'vw';
                    el.style.animationDuration = Math.random() * 2 + 2 + 's'; 
                    el.style.fontSize = Math.random() * 30 + 20 + 'px'; 
                    container.appendChild(el);
                    setTimeout(() => el.remove(), 4000);
                }, i * 50);
            }
        }

        // تشغيل الكتابة لأول صفحة عند تحميل الموقع
        window.onload = () => {
            // الصفحة الأولى لا تحتاج لمسح النص لأننا لم نضع لها فئة الت typewriter-text لتبقى ثابتة،
            // لكن إذا أردت الكتابة لأول عنوان:
            // typeAllInStep(1); 
        };
    </script>
</body>
</html>
