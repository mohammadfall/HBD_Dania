<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBD 🎉</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; overflow-x: hidden; font-family: 'Tajawal', sans-serif; 
            background: linear-gradient(135deg, #e0f7fa, #b2ebf2); color: #006064; 
        }
        /* تنسيق الفقاعات */
        .bubble { 
            position: absolute; border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%; animation: floatUp 8s linear infinite;
            opacity: 0.5; z-index: 1; pointer-events: none;
        }
        @keyframes floatUp { 
            0% { transform: translateY(100vh) scale(0.5); } 
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } 
        }
        .container { 
            text-align: center; max-width: 600px; margin: 10vh auto; 
            background: rgba(255, 255, 255, 0.9); padding: 40px; 
            border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px); position: relative; z-index: 10;
        }
        .step { display: none; animation: fadeIn 0.8s ease-in-out; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; } }
        
        /* تنسيق العداد */
        #countdown { font-size: 1.5em; font-weight: bold; color: #00838f; margin: 20px 0; }
        
        .intro-image { width: 100%; max-width: 450px; margin-bottom: 20px; border-radius: 20px; border: 4px solid white; }
        h1 { font-size: 2em; color: #00838f; }
        .btn { 
            background: #00838f; color: white; border: none; padding: 12px 25px; 
            font-size: 1.1em; border-radius: 30px; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { background: #006064; transform: scale(1.05); }
        .btn-back { background: #80cbc4; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 15px; overflow: hidden; margin-top: 20px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="bubbles-container"></div>

    <div class="container">
        <div id="step1" class="step active">
            <img src="HBD.png" alt="HBD Dania" class="intro-image">
            <h1>كل عام وأنتِ بألف خير دندن 💖</h1>
            <button class="btn" onclick="nextStep(1)">اضغطي هون ✨</button>
        </div>

        <div id="step2" class="step">
            <h1>بتعرفي شو؟ 🌸</h1>
            <p>مرّ على ميلادك هالفترة من الزمن:</p>
            <div id="countdown"></div>
            <p>إنتِ بتستاهلي كل إشي حلو !</p>
            <div class="buttons-container">
                <button class="btn btn-back" onclick="prevStep(2)">🔙</button>
                <button class="btn" onclick="nextStep(2)">التالي</button>
            </div>
        </div>

        <div id="step3" class="step">
            <h1>عملتلك هالفيديو 🎬</h1>
            <p> معلش كرنج هو بس مش كثير 😂 </p>
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID" frameborder="0" allowfullscreen></iframe>
            </div>
            <button class="btn btn-back" onclick="prevStep(3)">🔙</button>
            <button class="btn" onclick="nextStep(3)">المفاجأة الأخيرة 🎁</button>
        </div>

        <div id="step4" class="step">
            <h1>وصفة للسعادة المطلقة 🎊</h1>
            <p>التشخيص: أجمل صدفة بحياتي.<br>العلاج: جرعات يومية من الضحك، والابتسامة ممنوع تفارق وجهك.</p>
            <p>بحبك! ❤️</p>
            <button class="btn btn-back" onclick="prevStep(4)">🔙</button>
        </div>
    </div>

    <script>
        function nextStep(current) {
            document.getElementById('step' + current).classList.remove('active');
            document.getElementById('step' + (current + 1)).classList.add('active');
        }
        function prevStep(current) {
            document.getElementById('step' + current).classList.remove('active');
            document.getElementById('step' + (current - 1)).classList.add('active');
        }

        // منطق العداد التنازلي (منذ 17/7/2006)
        function updateCountdown() {
            const birthDate = new Date("2006-07-17T00:00:00");
            const now = new Date();
            const diff = now - birthDate;
            
            const years = Math.floor(diff / (1000 * 60 * 60 * 24 * 365.25));
            const days = Math.floor((diff % (1000 * 60 * 60 * 24 * 365.25)) / (1000 * 60 * 60 * 24));
            
            document.getElementById("countdown").innerHTML = `${years} سنة و ${days} يوم من السعادة`;
        }
        updateCountdown();

        // إنشاء الفقاعات
        function createBubbles() {
            const container = document.getElementById('bubbles-container');
            setInterval(() => {
                const b = document.createElement('div');
                const size = Math.random() * 50 + 10 + 'px';
                b.classList.add('bubble');
                b.style.width = size;
                b.style.height = size;
                b.style.left = Math.random() * 100 + 'vw';
                b.style.animationDuration = Math.random() * 5 + 5 + 's';
                container.appendChild(b);
                setTimeout(() => b.remove(), 8000);
            }, 800);
        }
        createBubbles();
    </script>
</body>
</html>
