<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> HBD Dania 🎉 </title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            margin: 0; 
            overflow-x: hidden; 
            font-family: 'Tajawal', sans-serif; 
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            color: #880e4f; 
            min-height: 100vh;
        }
        
        .floating-element { 
            position: absolute; 
            animation: floatUp linear infinite; 
            opacity: 0.6; 
            z-index: 1;
            pointer-events: none;
        }
        
        @keyframes floatUp { 
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; } 
            20% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5) rotate(360deg); opacity: 0; } 
        }

        .container { 
            text-align: center; 
            max-width: 650px; 
            margin: 8vh auto; 
            background: rgba(255, 255, 255, 0.7); 
            padding: 45px 30px; 
            border-radius: 25px; 
            box-shadow: 0 15px 35px rgba(216, 27, 96, 0.15); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            position: relative; 
            z-index: 10;
            min-height: 400px;
        }

        .step { display: none; }
        .step.active { display: block; }
        
        /* تنسيق الصور */
        .intro-image {
            width: 100%;
            max-width: 350px; 
            margin: 20px auto;
            display: block;
            box-shadow: 0 10px 25px rgba(216, 27, 96, 0.2);
            border: 5px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px; 
        }

        h1 { 
            font-size: 2.2em; 
            margin-bottom: 20px; 
            color: #c2185b; 
        }
        
        p.seq-item {
            font-size: 1.25em; 
            line-height: 1.9; 
            color: #4a4a4a; 
            margin-bottom: 30px; 
            min-height: 1.2em;
            word-wrap: break-word;
        }

        h2.seq-item {
            color: #c2185b; 
            margin: 40px 0 20px 0;
        }

        .hadith-box {
            background: rgba(255, 255, 255, 0.9);
            border-right: 5px solid #d81b60;
            padding: 20px;
            margin: 35px 0;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1.15em;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        
        #countdown-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin: 25px 0;
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.1);
        }
        
        #countdown {
            font-size: 1.5em;
            font-weight: 700;
            color: #d81b60;
            direction: rtl;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center; 
            gap: 15px; 
            margin-top: 40px;
            flex-wrap: wrap;
        }
        
        .btn { 
            background: linear-gradient(45deg, #d81b60, #ec407a); 
            color: white; 
            border: none; 
            padding: 12px 35px; 
            font-size: 1.15em; 
            border-radius: 30px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            font-weight: 700;
        }
        
        .btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.4);
        }
        
        .btn-back {
            background: rgba(244, 143, 177, 0.5);
            color: #880e4f;
        }

        .final-question {
            font-size: 2.2em;
            color: #ad1457;
            margin-bottom: 40px;
        }

        /* تنسيق زر الرفض */
        #btn-no {
            background: #9e9e9e; 
            position: relative; 
            z-index: 100;
            transition: opacity 0.5s ease; /* تأثير تلاشي ناعم عند الاختفاء */
        }
    </style>
</head>
<body>

    <div id="floating-container"></div>

    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        
        <div id="step1" class="step active">
            <img src="HBD.png" alt="HBD" class="intro-image">
            <h1>كل عام وأنتِ بألف خير دندن 💖</h1>
            
            <div id="countdown-container">
                <div id="countdown-title">باقي لتصيري 20 سنة:</div>
                <div id="countdown">جاري الحساب...</div>
            </div>

            <div class="buttons-container">
                <button class="btn" onclick="nextStep(1)">اضغطي هون ✨</button>
            </div>
        </div>

        <div id="step2" class="step">
            <h1>دانية العزيزة 🌸</h1>
            <p class="seq-item" data-type="text" data-text="قعدت فترة بفكر ايش اجيب هدية الك، بكل افكاري ما كان بنفع اقدم الي بخطرلي."></p>
            <p class="seq-item" data-type="text" data-text="ما لقيت الا هالطريقة البسيطة جداً."></p>
            <p class="seq-item" data-type="text" data-text="اسف عالكتابه البطيئه بس حبيت احط شخصيتي البطيئة كمان وانا اعمل الموقع 🐢"></p>

            <div class="buttons-container">
                <button class="btn btn-back" onclick="prevStep(2)">🔙 رجوع</button>
                <button class="btn" onclick="nextStep(2)">التالي ✨</button>
            </div>
        </div>

        <div id="step3" class="step">
            <p class="seq-item" data-type="text" data-text="دايما كنتي الشخص الي بكون معي بكل مكان وبكل ظرف من السيء للاشياء الي ما رح انساها. من وقت كنت مكتئب ومش قادر اعيش لوقت التخرج."></p>
            
            <p class="seq-item" data-type="text" data-text="احداث كثير ما حدا بعرفها غيري وغيرك، خناقات ومصالحات ما حدا بعرفها."></p>
            
            <p class="seq-item" data-type="text" data-text="ما بتعرفي كم انتي حدا كثير مهم بحياتي وكم بحبك، كشخص مثلي ما عمري كنت انتبه للتفاصيل معك صرت احاول ادقق (لسا مبتدئ ولكن بحاول :)"></p>
            
            <h2 class="seq-item" data-type="text" data-text="حتسأليني ليش؟ ليش انا؟"></h2>
            
            <p class="seq-item" data-type="text" data-text="ببساطة؟ لانك دانية، لانك دانية حبيتك ما عندي سبب اقوى من هيك."></p>

            <div class="buttons-container">
                <button class="btn btn-back" onclick="prevStep(3)">🔙 رجوع</button>
                <button class="btn" onclick="nextStep(3)">كملي قراءة ❤️</button>
            </div>
        </div>

        <div id="step4" class="step">
            <p class="seq-item" data-type="text" data-text="دايما بحكيلك ودايما بأكدلك انا معك عالمر والحلو، ايدي دايما ممدوده الك. لاني بنبسط وانا معك بنفس الطريق، بنبسط وانا بساعدك، بنبسط بس اسمع صوتك، بنبسط بس تتنمري علي 😂 صح بحبش كثير لما تحرجيني، بس فعالياتك هاي بتحسسني بشعور هيك اني مرتاح بتمنى يكون عندك نفس الشعور."></p>
            
            <img src="dumb-smart.png" alt="dumb-smart" class="intro-image seq-item" data-type="media" style="display: none; opacity: 0;">
            
            <p class="seq-item" data-type="text" data-text="صح انه انا احيانا بكون غبي وتصرفاتي غبية بس معلش هو هيك مخي قد ما احاول ما بتغير. وجد بتمنى دايما تضلي بخير ودايما بدعيلك بصلاتي، هي هيك الحياه."></p>
            
            <div class="hadith-box seq-item" data-type="media" style="display: none; opacity: 0;">
                "ما أصابك لم يكن ليخطئك وما أخطأك لم يكن ليصيبك.. دايماً تذكريه."
            </div>

            <div class="buttons-container">
                <button class="btn btn-back" onclick="prevStep(4)">🔙 رجوع</button>
                <button class="btn" onclick="nextStep(4)">الصفحة الأخيرة 💌</button>
            </div>
        </div>

        <div id="step5" class="step">
            <h1 class="final-question seq-item" data-type="text" data-text="وبالنهايه هذا سؤال... ممكن نضل دايما مع بعض؟ 🥺❤️"></h1>
            
            <div class="buttons-container" id="final-buttons">
                <button class="btn btn-yes" onclick="celebrate()">أكيد 💍</button>
                <button class="btn" id="btn-no" onmouseover="makeDisappear()" ontouchstart="makeDisappear()">لا 🏃🏻‍♀️</button>
            </div>
        </div>

    </div>

    <script>
        // نظام الطابور المحدث (يخفي الأزرار لحين انتهاء الكتابة وبسرعة أبطأ)
        function playSequence(stepId) {
            const step = document.getElementById('step' + stepId);
            const items = step.querySelectorAll('.seq-item');
            const navButtons = step.querySelector('.buttons-container');
            
            // إخفاء الأزرار تماماً في بداية الصفحة
            if (navButtons) {
                navButtons.style.display = 'none';
                navButtons.style.opacity = '0';
            }

            // إرجاع زر الرفض ليظهر إذا رجعنا للصفحة 5 بعد أن اختفى
            if(stepId === 5) {
                const btnNo = document.getElementById('btn-no');
                btnNo.style.display = 'inline-block';
                btnNo.style.opacity = '1';
            }
            
            items.forEach(item => {
                if (item.getAttribute('data-type') === 'text') {
                    item.textContent = '';
                    item.style.display = 'block';
                } else {
                    item.style.opacity = '0';
                    item.style.display = 'none';
                }
            });

            let currentIndex = 0;

            function showNext() {
                if (currentIndex >= items.length) {
                    if (navButtons) {
                        navButtons.style.display = 'flex';
                        setTimeout(() => {
                            navButtons.style.transition = 'opacity 0.8s ease';
                            navButtons.style.opacity = '1';
                        }, 50);
                    }
                    return;
                }

                const target = items[currentIndex];
                const type = target.getAttribute('data-type');

                if (type === 'text') {
                    const text = target.getAttribute('data-text');
                    let charIndex = 0;
                    let currentString = "";
                    
                    // سرعة كتابة بطيئة ومريحة (60 ملي ثانية)
                    const interval = setInterval(() => {
                        currentString += text.charAt(charIndex);
                        target.textContent = currentString;
                        charIndex++;
                        
                        if (charIndex >= text.length) {
                            clearInterval(interval);
                            currentIndex++;
                            setTimeout(showNext, 400); 
                        }
                    }, 60); 
                } 
                else if (type === 'media') {
                    target.style.display = 'block';
                    void target.offsetWidth; 
                    target.style.transition = 'opacity 1.5s ease';
                    target.style.opacity = '1';

                    currentIndex++;
                    setTimeout(showNext, 1200); 
                }
            }

            showNext();
        }

        function nextStep(current) {
            document.getElementById('step' + current).classList.remove('active');
            const next = current + 1;
            document.getElementById('step' + next).classList.add('active');
            
            playSequence(next);

            if (current === 2) {
                let audio = document.getElementById('bg-music');
                audio.play().catch(e => console.log("Audio play blocked"));
            }
        }

        function prevStep(current) {
            document.getElementById('step' + current).classList.remove('active');
            const prev = current - 1;
            document.getElementById('step' + prev).classList.add('active');
            
            playSequence(prev);
            
            if (current === 3) {
                let audio = document.getElementById('bg-music');
                audio.pause();
                audio.currentTime = 0; 
            }
        }

        // العداد التنازلي
        function startCountdown() {
            const countDownDate = new Date("July 17, 2026 00:00:00").getTime();
            setInterval(function() {
                const now = new Date().getTime();
                const distance = countDownDate - now;
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                if (distance < 0) {
                    document.getElementById("countdown").innerHTML = "صار عمرك 20 سنة! 🎉";
                } else {
                    document.getElementById("countdown").innerHTML = 
                        days + " يوم و " + hours + " ساعة و " + minutes + " دقيقة و " + seconds + " ثانية";
                }
            }, 1000);
        }
        startCountdown();

        // الفقاعات العائمة
        function createFloatingElements() {
            const container = document.getElementById('floating-container');
            const elements = ['✨', '🌸', '🤍', '💖', '⭐']; 
            setInterval(() => {
                const el = document.createElement('div');
                el.innerHTML = elements[Math.floor(Math.random() * elements.length)];
                el.classList.add('floating-element');
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = Math.random() * 4 + 5 + 's'; 
                el.style.fontSize = Math.random() * 15 + 15 + 'px'; 
                container.appendChild(el);
                setTimeout(() => el.remove(), 9000);
            }, 600); 
        }
        createFloatingElements();

        // دالة اختفاء الزر (محسنة للموبايل)
        function makeDisappear() {
            const btn = document.getElementById('btn-no');
            // بدلاً من الهروب، سنجعله يختفي تماماً فوراً
            btn.style.display = 'none';
        }

        // الاحتفال عند الموافقة
        function celebrate() {
            const container = document.getElementById('floating-container');
            document.getElementById('final-buttons').innerHTML = "<h2 style='color:#c2185b;'>وأنا بوعدك أضل معك دايماً ❤️</h2>";
            
            // تأكيد إخفاء زر الرفض
            const btnNo = document.getElementById('btn-no');
            if(btnNo) btnNo.style.display = 'none';

            for(let i=0; i<60; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.innerHTML = '❤️';
                    el.classList.add('floating-element');
                    el.style.left = Math.random() * 100 + 'vw';
                    el.style.animationDuration = Math.random() * 2 + 2 + 's'; 
                    el.style.fontSize = Math.random() * 30 + 20 + 'px'; 
                    container.appendChild(el);
                    setTimeout(() => el.remove(), 4000);
                }, i * 50);
            }
        }
    </script>
</body>
</html>
