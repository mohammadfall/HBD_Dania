<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى دانية</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital@1&family=Tajawal:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3d3d3d;
            --accent-color: #c0a080; /* لون ذهبي خافت */
        }
        body, html { margin: 0; padding: 0; height: 100%; background: #1a1a1a; font-family: 'Tajawal', sans-serif; overflow: hidden; color: #fff; }

        /* تأثير الغبار الضوئي في الخلفية */
        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        /* شاشة البداية (اضغط للبدء) */
        #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; z-index: 100; display: flex; justify-content: center; align-items: center; transition: 2s; }
        .start-btn { background: none; border: 1px solid var(--accent-color); color: var(--accent-color); padding: 15px 40px; font-size: 1.2rem; cursor: pointer; transition: 0.5s; letter-spacing: 2px; }
        .start-btn:hover { background: var(--accent-color); color: #1a1a1a; }

        /* تأثير البلور والنص العمودي */
        #cinematic-intro { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); z-index: 50; display: none; overflow: hidden; }
        .credits-wrap { position: absolute; width: 100%; bottom: -100%; animation: scrollUp 15s linear forwards; text-align: center; }
        .credits-wrap h2 { font-family: 'Amiri', serif; font-size: 3rem; color: var(--accent-color); margin-bottom: 50px; }
        .credits-wrap p { font-size: 1.5rem; line-height: 2.5; opacity: 0.8; max-width: 80%; margin: 0 auto; }

        @keyframes scrollUp {
            0% { bottom: -100%; }
            100% { bottom: 120%; }
        }

        /* شاشة الفيديو والمحتوى */
        .main-content { position: relative; z-index: 10; height: 100vh; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px; animation: fadeIn 3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .video-box { width: 100%; max-width: 800px; aspect-ratio: 16/9; border: 1px solid rgba(192, 160, 128, 0.3); border-radius: 4px; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        .video-box iframe { width: 100%; height: 100%; border: none; }

        /* أزرار التحكم */
        .controls { margin-top: 30px; display: flex; gap: 20px; align-items: center; }
        .btn-main { background: var(--accent-color); color: #1a1a1a; border: none; padding: 12px 30px; border-radius: 2px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-back { background: none; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.4); padding: 5px 15px; font-size: 0.8rem; cursor: pointer; border-radius: 2px; }
        .btn-back:hover { color: #fff; border-color: #fff; }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3" type="audio/mpeg">
    </audio>

    <canvas id="canvas"></canvas>

    <div id="start-screen">
        <button class="start-btn" onclick="startJourney()">ابدأ الرحلة</button>
    </div>

    <div id="cinematic-intro">
        <div class="credits-wrap">
            <h2>كل عام وأنتِ بخير يا دانية</h2>
            <p>في هذا اليوم المميز..</p>
            <p>أحببت أن أهديكِ شيئاً يشبُهك</p>
            <p>شيئاً هادئاً، عميقاً، وصادقاً</p>
            <p>قصة قصيرة.. أنتِ بطلتها</p>
            <p>استعدي..</p>
        </div>
    </div>

    <div id="main-content" class="main-content">
        <div class="video-box">
            <iframe id="yt-player" src="https://www.youtube.com/embed/YOUR_VIDEO_ID?enablejsapi=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        
        <div class="controls">
            <button class="btn-back" onclick="restartIntro()">↺ إعادة العرض</button>
            <button class="btn-main" onclick="alert('هنا تضع رسالتك الأخيرة أو هدية إضافية')">المفاجأة الأخيرة ✨</button>
        </div>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        
        function startJourney() {
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('cinematic-intro').style.display = 'block';
                music.play();
                
                // الانتقال للفيديو بعد انتهاء الانترو (بعد 15 ثانية)
                setTimeout(() => {
                    showMainContent();
                }, 15000);
            }, 2000);
        }

        function showMainContent() {
            document.getElementById('cinematic-intro').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('cinematic-intro').style.display = 'none';
                document.getElementById('main-content').style.display = 'flex';
            }, 2000);
        }

        function restartIntro() {
            location.reload(); // أسهل طريقة لإعادة التجربة كاملة
        }

        // --- كود تأثير الجزيئات الضوئية (Background Particles) ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.1;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.fillStyle = `rgba(192, 160, 128, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createParticles() {
            for (let i = 0; i < 100; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        createParticles();
        animate();
    </script>
</body>
</html>
